[env:sensecap_solar]
extends = common
platform = nordicnrf52
platform_packages =
    framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301665b40959682252911e57b11df3ee651a
    platformio/toolchain-gccarmnoneeabi@^1.140201.0
board = seeed_sensecap_solar
board_build.ldscript = boards/nrf52840_s140_v7.ld
board_upload.maximum_size = 811008
upload_protocol = nrfutil
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DAXLORA_VARIANT_SENSECAP_SOLAR
    -DNRF52_PLATFORM
    -DNRF52_POWER_MANAGEMENT
    -Ivariants/sensecap_solar
